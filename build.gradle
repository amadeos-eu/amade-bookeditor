plugins {
    id 'java'
    id 'application'
}

group = 'eu.amadeos'
// CI computes the version from the Conventional Commits since the last release tag and passes it as
// -PappVersion (amadeos-eu/amadeos-ci scripts/next-version.sh); a build without it is a local development build.
version = findProperty('appVersion') ?: '0.0.0-dev.0'
// Debian sorts 1.1.0~dev.57 before 1.1.0 (with - it would sort after it).
def debVersion = version.toString().replace('-', '~')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'eu.amadeos.apps.bookeditor.bootstrap.AmadeBookEditorApplication'
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    // Theme, Motif look, start-up and XDG helpers shared by all amadeOS applications.
    // With ../amade-commons checked out, settings.gradle builds that checkout instead (composite build).
    implementation 'com.github.amadeos-eu:amade-commons:82d0f99f19'
    // jsoup (reading the book's XHTML back) comes with amade-commons, whose typesetter uses it too.
    runtimeOnly 'ch.qos.logback:logback-classic:1.5.18'
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // The W3C checker: every book the tests save must pass it, like the Check Book window requires.
    testImplementation 'org.w3c:epubcheck:5.1.0'
}

test {
    useJUnitPlatform()
    // Tests compare English texts, whatever the language of the build machine.
    systemProperty 'user.language', 'en'
    systemProperty 'user.country', 'US'
}

jar {
    archiveBaseName = 'amade-bookeditor'
    manifest {
        attributes(
            'Main-Class': 'eu.amadeos.apps.bookeditor.bootstrap.AmadeBookEditorApplication',
            'Implementation-Title': 'amade-bookeditor',
            'Implementation-Version': project.version
        )
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    // Signed dependency jars would otherwise invalidate the fat jar.
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('deb') {
    dependsOn jar
    description = 'Builds a standard Debian (.deb) package for amade-bookeditor'
    group = 'distribution'

    doLast {
        def buildDirFile = layout.buildDirectory.get().asFile
        def stagingDir = new File(buildDirFile, 'deb-staging')
        delete(stagingDir)

        def optDir = new File(stagingDir, 'opt/amade-bookeditor')
        def binDir = new File(stagingDir, 'usr/bin')
        def appDir = new File(stagingDir, 'usr/share/applications')
        def iconDir = new File(stagingDir, 'usr/share/icons/hicolor/48x48/apps')
        def docDir = new File(stagingDir, 'usr/share/doc/amade-bookeditor')
        def debianDir = new File(stagingDir, 'DEBIAN')
        def distDir = new File(buildDirFile, 'distributions')
        [optDir, binDir, appDir, iconDir, docDir, debianDir, distDir]*.mkdirs()

        copy {
            from jar.archiveFile
            into optDir
            rename { 'amade-bookeditor.jar' }
        }

        def launcher = new File(binDir, 'amade-bookeditor')
        // The options all amadeOS programs share (heap, garbage collector) come first from the argument file
        // amadeos-session installs; the options after it win over them.
        launcher.text = """#!/bin/sh
OPTIONS=/etc/amadeos/java/app.options
[ -r "\$OPTIONS" ] || OPTIONS=/dev/null
exec /usr/bin/java "@\$OPTIONS" -Xmx512m -jar /opt/amade-bookeditor/amade-bookeditor.jar "\$@"
"""
        launcher.setExecutable(true, false)

        copy {
            from 'packaging/amade-bookeditor.desktop'
            into appDir
        }
        // AppStream metadata: name, description and screenshot for amadeOS Software (and a repository's
        // appstream-generator).
        copy {
            from 'packaging/eu.amadeos.apps.bookeditor.metainfo.xml'
            into new File(stagingDir, "usr/share/metainfo")
        }
        copy {
            from 'src/main/resources/icons/amade-bookeditor.png'
            into iconDir
        }
        copy {
            from 'LICENSE'
            into docDir
            rename { 'copyright' }
        }

        new File(debianDir, 'control').text = """Package: amade-bookeditor
Version: ${debVersion}
Section: text
Recommends: epubcheck, hyphen-en-us, hyphen-de, hyphen-fr, hyphen-it, hyphen-es
Priority: optional
Architecture: all
Depends: openjdk-25-jre | java-runtime (>= 25), amadeos-java-options
Maintainer: amadeOS Project <developers@datazuul.com>
Description: EPUB 3 book editor for amadeOS
 Writes e-books without HTML: chapters in an outline, paragraph styles
 (chapter title, heading, quote, poem, letter, motto), pictures with
 captions and descriptions, footnotes, links and scene breaks. Book details,
 a cover maker, four ready-made looks and a preview set like in amadeOS
 Books. Check Book explains problems in plain words and runs EPUBCheck.
 Saves valid, accessible EPUB 3. Part of the amadeOS desktop.
"""

        def debFile = new File(distDir, "amade-bookeditor_${debVersion}_all.deb")
        def process = new ProcessBuilder('dpkg-deb', '--root-owner-group', '--build',
                stagingDir.absolutePath, debFile.absolutePath)
                .redirectErrorStream(true)
                .start()
        process.inputStream.eachLine { println it }
        if (process.waitFor() != 0) {
            throw new GradleException('dpkg-deb failed')
        }
        println "[deb] Created ${debFile.absolutePath}"
    }
}

tasks.register('installToAmadeOs') {
    dependsOn 'deb'
    description = 'Builds and drops the .deb package into ../amadeos/config/packages.chroot/'
    group = 'distribution'

    doLast {
        def targetDir = file('../amadeos/config/packages.chroot')
        targetDir.mkdirs()
        def debFile = new File(layout.buildDirectory.get().asFile, "distributions/amade-bookeditor_${debVersion}_all.deb")
        copy {
            from debFile
            into targetDir
        }
        println "[installToAmadeOs] Copied ${debFile.name} to ${targetDir.absolutePath}"
    }
}

// The pictures in docs/screenshots: xvfb-run ./gradlew screenshots
tasks.register('screenshots', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'eu.amadeos.apps.bookeditor.tools.Screenshots'
    args = [file('docs/screenshots').path, project.findProperty('lang') ?: 'en']
}
